apiVersion: apps/v1
kind: Deployment
metadata:
  name: project4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project4
  template:
    metadata:
      labels:
        app: project4
    spec:
      containers:
        - name: web
          image: stelabiju/project4-devsecops:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: project4
spec:
  type: NodePort
  selector:
    app: project4
  ports:
    - port: 80
      targetPort: 8000
