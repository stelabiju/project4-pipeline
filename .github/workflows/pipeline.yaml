
name: Project4 DevSecOps Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/deployment.yaml"
      - "argocd/application.yaml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: stelabiju/project4-devsecops

jobs:
  devsecops:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Trivy Filesystem Security Scan
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            aquasec/trivy:0.74.0 fs \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 /src

      - name: Django System Check
        run: python manage.py check

      - name: Build Docker Image
        run: |
          docker build \
            -t "$IMAGE_NAME:${GITHUB_RUN_NUMBER}" \
            -t "$IMAGE_NAME:latest" .

      - name: Trivy Docker Image Scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.74.0 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            "$IMAGE_NAME:${GITHUB_RUN_NUMBER}"

      - name: Start Application for DAST
        run: |
          docker run -d \
            --name project4-test \
            -p 8000:8000 \
            "$IMAGE_NAME:${GITHUB_RUN_NUMBER}"

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
              echo "Application is responding"
              exit 0
            fi
            sleep 2
          done

          docker logs project4-test
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:8000"
          fail_action: false

      - name: Stop Test Application
        if: always()
        run: docker rm -f project4-test || true

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE_NAME:${GITHUB_RUN_NUMBER}"
          docker push "$IMAGE_NAME:latest"

      - name: Update GitOps Manifest
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("k8s/deployment.yaml")
          if not path.exists():
              raise SystemExit("Missing k8s/deployment.yaml")

          content = path.read_text()
          old_image = "stelabiju/project4-devsecops:"
          lines = content.splitlines(keepends=True)
          updated = []
          found = False

          for line in lines:
              if "image:" in line and old_image in line:
                  prefix, value = line.split("image:", 1)
                  newline = "\n" if line.endswith("\n") else ""
                  line = (
                      prefix + "image: "
                      + old_image + os.environ["IMAGE_TAG"]
                      + newline
                  )
                  found = True
              updated.append(line)

          if not found:
              raise SystemExit(
                  "No project4-devsecops image found in deployment manifest"
              )

          path.write_text("".join(updated))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "Update Project4 image to ${IMAGE_TAG}" || exit 0
          git push
