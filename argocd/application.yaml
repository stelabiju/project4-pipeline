apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project4
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/stelabiju/project4-pipeline.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
